name: elevenlabs-tts

on:
  workflow_dispatch:
    inputs:
      text:
        description: "Text to synthesize (max ~2500 chars recommended)"
        required: true
        type: string
      voice_id:
        description: "ElevenLabs voice ID. Default Sarah works on free. Library voices 402."
        required: true
        default: "EXAVITQu4vr4xnSDxMaL"
        type: string
      outfile:
        description: "Output filename under artifacts/"
        required: false
        default: "elevenlabs-out.mp3"
        type: string

# Requires repository secret: ELEVEN_LABS_KEY_
# Working free-tier default: Sarah EXAVITQu4vr4xnSDxMaL (run 36407196951 = success)
# Rachel 21m00Tcm4TlvDq8ikWAM and library IDs return HTTP 402 on free.

jobs:
  tts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Validate secret presence (no echo of value)
        env:
          ELEVEN_LABS_KEY_: ${{ secrets.ELEVEN_LABS_KEY_ }}
        run: |
          if [ -z "$ELEVEN_LABS_KEY_" ]; then
            echo "::error::Missing repository secret ELEVEN_LABS_KEY_"
            echo "Settings → Secrets and variables → Actions → name must be exactly ELEVEN_LABS_KEY_"
            exit 1
          fi
          echo "ELEVEN_LABS_KEY_ is set (length withheld)"

      - name: Call ElevenLabs TTS
        env:
          ELEVEN_LABS_KEY_: ${{ secrets.ELEVEN_LABS_KEY_ }}
          VOICE_ID: ${{ inputs.voice_id }}
          OUTFILE: ${{ inputs.outfile }}
        run: |
          mkdir -p artifacts
          HTTP_CODE=$(curl -sS -o "artifacts/${OUTFILE}" -w "%{http_code}" \
            -X POST "https://api.elevenlabs.io/v1/text-to-speech/${VOICE_ID}" \
            -H "xi-api-key: ${ELEVEN_LABS_KEY_}" \
            -H "Content-Type: application/json" \
            -H "Accept: audio/mpeg" \
            -d "$(jq -n --arg t "${{ inputs.text }}" '{text:$t, model_id:"eleven_multilingual_v2"}')")
          echo "HTTP status: ${HTTP_CODE}"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::ElevenLabs TTS failed with HTTP ${HTTP_CODE}"
            file "artifacts/${OUTFILE}" || true
            head -c 500 "artifacts/${OUTFILE}" || true
            exit 1
          fi
          ls -la "artifacts/${OUTFILE}"

      - name: Upload MP3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: elevenlabs-tts
          path: artifacts/${{ inputs.outfile }}
          if-no-files-found: error
